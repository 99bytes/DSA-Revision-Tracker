openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: questions
    description: DSA question operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /revisions:
    get:
      operationId: listRevisions
      tags: [questions]
      summary: List all revisions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Revision"
    post:
      operationId: createRevision
      tags: [questions]
      summary: Create a revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"

  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List all questions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Create a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /questions/{id}:
    patch:
      operationId: updateQuestion
      tags: [questions]
      summary: Update a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "404":
          description: Not found
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Revision:
      type: object
      required:
        - id
        - questionId
        - previousConfidence
        - newConfidence
        - createdAt
      properties:
        id:
          type: string
        questionId:
          type: string
        previousConfidence:
          type: integer
        newConfidence:
          type: integer
        createdAt:
          type: string

    RevisionInput:
      type: object
      required:
        - questionId
        - previousConfidence
        - newConfidence
      properties:
        questionId:
          type: string
        previousConfidence:
          type: integer
          minimum: 1
          maximum: 5
        newConfidence:
          type: integer
          minimum: 1
          maximum: 5

    Question:
      type: object
      required:
        - id
        - name
        - platform
        - tags
        - approach
        - timeComplexity
        - confidence
        - lastRevised
        - mistakeNotes
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        tags:
          type: array
          items:
            type: string
        approach:
          type: string
        timeComplexity:
          type: string
        confidence:
          type: integer
        lastRevised:
          type: string
        mistakeNotes:
          type: string

    QuestionInput:
      type: object
      required:
        - name
        - platform
        - confidence
        - lastRevised
      properties:
        name:
          type: string
          minLength: 1
        platform:
          type: string
        tags:
          type: array
          items:
            type: string
        approach:
          type: string
        timeComplexity:
          type: string
        confidence:
          type: integer
          minimum: 1
          maximum: 5
        lastRevised:
          type: string
        mistakeNotes:
          type: string

    QuestionUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        platform:
          type: string
        tags:
          type: array
          items:
            type: string
        approach:
          type: string
        timeComplexity:
          type: string
        confidence:
          type: integer
          minimum: 1
          maximum: 5
        lastRevised:
          type: string
        mistakeNotes:
          type: string
